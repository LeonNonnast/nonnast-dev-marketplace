name: Release skill ZIPs

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package-skills.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Skill-ZIPs zum Hochladen in claude.ai (Customize → Skills → Upload skill)."
